spring.application.name=student-participation-system

# ===============================
# Server
# ===============================

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api


# ===============================
# Oracle datasource
# ===============================

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:diplomski}
spring.datasource.password=${DB_PASSWORD:diplomski}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# ===============================
# HikariCP
# ===============================

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ===============================
# Flyway
# ===============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# ===============================
# Actuator
# ===============================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized


# ===============================
# Application
# ===============================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}
app.cors.exposed-headers=${CORS_EXPOSED_HEADERS:Location}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${CORS_MAX_AGE:1h}

app.security.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
app.security.jwt.expires-in=${JWT_EXPIRES_IN:900}
